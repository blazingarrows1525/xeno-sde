# Render Blueprint — deploys the two Kairos FastAPI services as Docker web services.
# The Next.js web app deploys separately on Vercel (root directory: apps/web).
# See DEPLOY.md for the full walkthrough.
#
# After "New > Blueprint" picks this up, set the CRM secrets marked `sync: false`:
#   DATABASE_URL, ANTHROPIC_API_KEY, CORS_ORIGINS,
#   CHANNEL_SERVICE_URL  → the kairos-channel URL, e.g. https://kairos-channel.onrender.com
#   CRM_PUBLIC_URL       → this service's own URL,  e.g. https://kairos-crm.onrender.com
# The HMAC secret is generated on the CRM and copied to the channel automatically (fromService),
# so the signed receipt callbacks verify on both ends.
services:
  - type: web
    name: kairos-crm
    runtime: docker
    plan: free
    region: singapore            # next to the Neon ap-southeast-1 database
    dockerfilePath: apps/crm/Dockerfile
    dockerContext: apps/crm
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL          # Neon pooler connection string
        sync: false
      - key: ANTHROPIC_API_KEY     # for the live agent (Haiku 4.5)
        sync: false
      - key: CORS_ORIGINS          # your Vercel URL, e.g. https://kairos-web.vercel.app
        sync: false
      - key: CHANNEL_SERVICE_URL   # where the CRM POSTs sends — the kairos-channel public URL
        sync: false
      - key: CRM_PUBLIC_URL        # where the channel calls back — this service's public URL
        sync: false
      - key: RECEIPT_HMAC_SECRET   # signs/verifies receipt callbacks (shared with the channel)
        generateValue: true

  - type: web
    name: kairos-channel
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: apps/channel/Dockerfile
    dockerContext: apps/channel
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Copied from the CRM so both ends share one secret — the receipt HMAC matches by design.
      - key: HMAC_SECRET
        fromService:
          type: web
          name: kairos-crm
          envVarKey: RECEIPT_HMAC_SECRET
